version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: realestate_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: realestate_backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DB_URL: mongodb://mongodb:27017
      DB: Prolink
      DEFAULT_USERS: admin@gmail.com
      NODE_ENV: development
    depends_on:
      - mongodb

volumes:
  mongodb_data:
